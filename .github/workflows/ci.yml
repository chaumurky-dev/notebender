name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  # The deterministic path (transpose → musicxml2ly → lilypond) with the real external tools,
  # no API key needed.
  offline-pipeline:
    name: offline pipeline (lilypond)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lilypond poppler-utils
      - run: cargo build
      - run: ./target/debug/notebender doctor || true
      - run: ./target/debug/notebender transpose tests/fixtures/simple.musicxml --to Bb --format lilypond,pdf -o ci-out
      - run: test -s ci-out/score.pdf && test -s ci-out/score.ly && grep -q "<fifths>-2</fifths>" ci-out/score.musicxml
      - uses: actions/upload-artifact@v4
        with:
          name: offline-pipeline-output
          path: ci-out
          if-no-files-found: error

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
